name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + API tests
        run: pytest -q
      - name: Training pipeline smoke test (MovieLens small)
        # Writes to a scratch dir so the committed ML-32M model isn't touched.
        run: python -m scripts.train --dataset ml-latest-small --quick
        env:
          RECOMMENDER_MODELS_DIR: ${{ runner.temp }}/models
      - name: API serves the committed model
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          c = TestClient(app)
          assert c.get('/health').json()['model'] == 'two-stage-ease-lightgbm', c.get('/health').json()
          assert len(c.post('/recommendations', json={'liked': [1, 2], 'k': 5}).json()) == 5
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NITRO_PRESET: node-server

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
