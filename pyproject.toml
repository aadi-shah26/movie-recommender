[project]
name = "movie-recommender"
version = "0.2.0"
description = "Hybrid (collaborative + content) movie recommender with a FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
